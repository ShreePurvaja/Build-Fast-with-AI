[project]
name = "ai-workforce-backend"
version = "0.1.0"
description = "AI Workforce Platform FastAPI Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pymongo>=4.6.0",
    "motor>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false
